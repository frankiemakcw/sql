<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primary Key Practice — Progress Overview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100/70 text-slate-800 min-h-screen font-sans antialiased flex flex-col selection:bg-indigo-100 selection:text-indigo-900">

    <header class="bg-white border-b border-slate-200/80 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-100 flex items-center justify-center text-indigo-500 text-xl">
                    <i class="fa-solid fa-key"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl leading-tight text-slate-800">Primary Key Practice</h1>
                    <p class="text-xs text-slate-500 font-medium">Interactive Relational Database Masterclass</p>
                </div>
            </div>
            <nav class="ml-auto flex flex-wrap items-center gap-1.5 text-xs font-bold">
                <a href="table-overview.html" class="px-2.5 py-1.5 rounded-lg border border-indigo-300 bg-indigo-50 text-indigo-800">Overview</a>
                <a href="table-easy.html" class="px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50">Level 1</a>
                <a href="table-medium.html" class="px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50">Level 2</a>
                <a href="table-hard.html" class="px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50">Level 3</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-5 space-y-5">
        <section class="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 shadow-sm">
            <div class="flex flex-wrap items-start justify-between gap-4 mb-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">Your Progress</h2>
                    <p id="progress-copy" class="text-sm text-slate-500 mt-1">Complete all three one-table primary key levels.</p>
                </div>
                <button onclick="resetAllProgress()" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700 border border-slate-300 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-rotate-left text-xs"></i> Reset All Progress
                </button>
            </div>
            <div class="flex items-center justify-between text-xs font-bold text-slate-600 mb-2">
                <span>Levels completed</span>
                <span id="progress-count">0 / 3</span>
            </div>
            <div class="h-3 bg-slate-100 rounded-full overflow-hidden border border-slate-200">
                <div id="progress-bar" class="h-full bg-emerald-600 rounded-full transition-all" style="width: 0%"></div>
            </div>
        </section>

        <section id="level-grid" class="grid md:grid-cols-3 gap-5"></section>
    </main>

    <footer class="bg-white border-t border-slate-200/80 text-center py-4 text-xs sm:text-sm text-slate-500 font-medium">
        Primary Key Practice · Progress Overview
    </footer>

    <script src="table-progress.js"></script>
    <script>
        function statusMeta(status) {
            if (status === 'completed') {
                return { label: 'Completed', icon: 'fa-trophy', chip: 'bg-emerald-50 border-emerald-200 text-emerald-800', card: 'border-emerald-200' };
            }
            if (status === 'in_progress') {
                return { label: 'In progress', icon: 'fa-spinner', chip: 'bg-amber-50 border-amber-200 text-amber-800', card: 'border-amber-200' };
            }
            return { label: 'Not started', icon: 'fa-circle', chip: 'bg-slate-100 border-slate-200 text-slate-600', card: 'border-slate-200' };
        }

        function actionLabel(status) {
            if (status === 'completed') return 'Review Level';
            if (status === 'in_progress') return 'Continue';
            return 'Start';
        }

        function renderOverview() {
            const rows = window.PkProgress.summary();
            const done = rows.filter((r) => r.status === 'completed').length;
            const total = rows.length;
            document.getElementById('progress-count').textContent = `${done} / ${total}`;
            document.getElementById('progress-bar').style.width = `${(done / total) * 100}%`;
            document.getElementById('progress-copy').textContent = done === total
                ? 'All three levels are complete. Great work!'
                : `${done} of ${total} levels completed. Progress is saved in this browser.`;

            document.getElementById('level-grid').innerHTML = rows.map((level) => {
                const meta = statusMeta(level.status);
                return `
                    <article class="bg-white border ${meta.card} rounded-2xl p-5 shadow-sm flex flex-col gap-4">
                        <div class="flex items-start justify-between gap-3">
                            <div class="flex items-center gap-3">
                                <div class="w-11 h-11 rounded-xl bg-slate-100 border border-slate-200 text-slate-700 flex items-center justify-center text-lg">
                                    <i class="fa-solid ${level.icon}"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-slate-800">${level.title} · ${level.topic}</h3>
                                    <p class="text-xs text-slate-500 mt-0.5">${level.detail}</p>
                                </div>
                            </div>
                            <span class="shrink-0 text-xs font-bold px-2.5 py-1 rounded-lg border ${meta.chip}">
                                <i class="fa-solid ${meta.icon} mr-1"></i>${meta.label}
                            </span>
                        </div>
                        <a href="${level.href}" class="mt-auto inline-flex items-center justify-center gap-2 px-4 py-2 rounded-xl bg-indigo-100 hover:bg-indigo-200 text-indigo-700 text-xs font-bold transition">
                            ${actionLabel(level.status)} <i class="fa-solid fa-arrow-right text-xs"></i>
                        </a>
                    </article>`;
            }).join('');
        }

        function resetAllProgress() {
            if (!confirm('Clear saved progress for all three levels on this browser?')) return;
            window.PkProgress.resetAll();
            renderOverview();
        }

        document.addEventListener('DOMContentLoaded', renderOverview);
    </script>
</body>
</html>
