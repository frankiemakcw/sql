<!DOCTYPE html>
<html lang="en">
<head>

        .code-font { font-family: ui-monospace, 'Cascadia Code', 'Consolas', monospace; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .table-container { border: 1px solid #e2e8f0; border-radius: 8px; overflow: auto; background: white; height: 100%; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
        th { background-color: #f5f6f9; color: #6d7888; font-weight: 600; text-align: left; padding: 6px 8px; border-bottom: 1px solid #e3e7ee; position: sticky; top: 0; z-index: 5; font-size: 0.75rem; }
        td { padding: 6px 8px; border-bottom: 1px solid #f1f3f6; color: #3f4b5b; white-space: nowrap; }
        
        .task-card { cursor: pointer; transition: all 0.2s; border-left: 4px solid transparent; }
        .task-card.active { background-color: #eef0f7; border-left-color: #8b95c9; }

        .status-not-attempted { background-color: #f1f3f6; color: #6d7888; }

            overflow-wrap: normal;
            overflow-x: auto;
            resize: none;
            font-variant-ligatures: none;

        // --- Persistence Logic ---

        function saveCurrentQuery() {
            const task = tasks[activeTaskIdx];
            // Access raw plain text value directly
            const query = document.getElementById('editor').value;
            localStorage.setItem(`sql_functions_query_${task.id}`, query);
        }

        function loadSavedQuery(taskId) {
            return localStorage.getItem(`sql_functions_query_${taskId}`) || "";
        }

        function saveProgress() {
            const progress = tasks.map(t => ({ id: t.id, status: t.status }));
            localStorage.setItem('sql_functions_progress', JSON.stringify(progress));
        }

        function loadProgress() {
            const saved = localStorage.getItem('sql_functions_progress');
            if (saved) {
                const progressData = JSON.parse(saved);
                progressData.forEach(p => {
                    const task = tasks.find(t => t.id === p.id);
                    if (task) task.status = p.status;
                });
            }
        }

                if (t.group !== currentGroup) {
                    currentGroup = t.group;
                    html += `<div class="mt-3 mb-1 px-2 text-xs font-bold text-slate-400">${currentGroup}</div>`;
                }
                const dot = t.status === 'completed' ? 'bg-green-500' : (t.status === 'incorrect' ? 'bg-red-500' : 'bg-slate-300');
                html += `
                    <div onclick="loadTask(${i})" id="task-card-${i}" class="task-card p-2 bg-white rounded-lg shadow-sm mb-1 border border-slate-200 ${activeTaskIdx === i ? 'active' : ''}">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold text-slate-800 truncate">${t.id}. ${t.title}</span>
                            <div class="w-1.5 h-1.5 rounded-full ${dot}"></div>
                        </div>
                    </div>`;
            });
            list.innerHTML = html;
        }

        function loadTask(idx) {
            activeTaskIdx = idx;
            const t = tasks[idx];
            document.getElementById('current-task-title').innerText = `${t.group} · ${t.id} ${t.title}`;
            document.getElementById('current-task-desc').innerText = t.desc;
            
            const editor = document.getElementById('editor');
            editor.value = loadSavedQuery(t.id);
            
            const badge = document.getElementById('task-badge');
            badge.classList.remove('hidden');
            badge.className = `status-badge ${t.status === 'completed' ? 'status-completed' : (t.status === 'incorrect' ? 'status-incorrect' : 'status-not-attempted')}`;
            badge.innerText = t.status.replace('_', ' ');

            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('query-result').innerHTML = `<div class="h-full flex items-center justify-center text-slate-300 text-[10px] italic p-4 text-center">Run your query to see results here.</div>`;
            
            renderTaskSidebar();
            updateReferenceTables(t);
            editor.focus();
            editor.setSelectionRange(editor.value.length, editor.value.length);
        }

        function updateReferenceTables(task) {
            const nameSpan = document.getElementById('ref-table-name');
            nameSpan.innerText = task.table;
            const srcRes = db.exec(`SELECT * FROM ${task.table}`);
            document.getElementById('source-table').innerHTML = generateTableHTML(srcRes[0].columns, srcRes[0].values);

            const expRes = db.exec(task.sql);
            document.getElementById('expected-result').innerHTML = generateTableHTML(expRes[0].columns, expRes[0].values);
        }

        function handleEditorKeydown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                checkTask();
            }
        }

        function checkTask() {
            const userSql = document.getElementById('editor').value.trim();
            const feedback = document.getElementById('feedback');
            const resultBox = document.getElementById('query-result');
            const task = tasks[activeTaskIdx];
            if (!userSql) return;

            try {
                const userRes = db.exec(userSql);
                const correctRes = db.exec(task.sql);
                
                if (userRes.length > 0) {
                    resultBox.innerHTML = generateTableHTML(userRes[0].columns, userRes[0].values);
                    
                    // We only compare the 'values' array so that different column names or aliases don't fail the check
                    const isCorrect = JSON.stringify(userRes[0].values) === JSON.stringify(correctRes[0].values);
                    
                    if (isCorrect) {
                        task.status = 'completed';
                        feedback.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> <span>Excellent! The output matches perfectly.</span>`;
                        feedback.className = "mt-3 p-3 rounded-lg text-xs font-semibold flex bg-green-50 text-green-700 border border-green-200";
                    } else if (task.status !== 'completed') {
                        task.status = 'incorrect';
                        feedback.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg> <span>The result does not match the expected output. Try again.</span>`;
                        feedback.className = "mt-3 p-3 rounded-lg text-xs font-semibold flex bg-red-50 text-red-700 border border-red-200";
                    }
                } else {
                    if (task.status !== 'completed') task.status = 'incorrect';
                    resultBox.innerHTML = "<div class='h-full flex items-center justify-center text-slate-300 text-[10px] italic p-4'>No rows returned.</div>";
                }
            } catch (err) {
                feedback.innerHTML = `<strong>SQL Error:</strong> ${err.message}`;
                feedback.className = "mt-3 p-3 rounded-lg text-xs font-mono bg-slate-900 text-red-400 leading-relaxed";
            }
            
            saveProgress();
            const badge = document.getElementById('task-badge');
            badge.className = `status-badge ${task.status === 'completed' ? 'status-completed' : (task.status === 'incorrect' ? 'status-incorrect' : 'status-not-attempted')}`;
            badge.innerText = task.status.replace('_', ' ');
            renderTaskSidebar();
        }

        function generateTableHTML(columns, values) {
            if (!columns || columns.length === 0) return "<div class='p-4 text-center text-slate-300 text-[10px]'>Empty set.</div>";
            let html = `<table><thead><tr>${columns.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>`;
            values.forEach(row => html += `<tr>${row.map(cell => `<td>${cell ?? '<span class="text-slate-300 italic">null</span>'}</td>`).join('')}</tr>`);
            return html + `</tbody></table>`;
        }
        
        window.onload = init;
    </script>
</body>
</html>
